name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            target: dmg
            artifact: desktop-pet-mac
            asset: release/Desktop-Pet-mac.dmg
          - os: windows-latest
            platform: win
            target: nsis
            artifact: desktop-pet-windows
            asset: release/Desktop-Pet-windows.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer processes
        run: npm run build

      - name: Package installer
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/Desktop-Pet-mac.dmg
            release-assets/Desktop-Pet-windows.exe
