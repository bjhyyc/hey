services:
  studio-api:
    profiles: ["studio-production"]
    image: ${PETPACK_RUNTIME_IMAGE:?Set PETPACK_RUNTIME_IMAGE to an immutable image digest}
    container_name: petpack-studio-api
    command: ["src/runtime/start-studio-api.js"]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PETPACK_PLATFORM_MODE: production
      PETPACK_API_PORT: "8787"
      PETPACK_POSTGRES_URL_FILE: /run/secrets/postgres_url
      PETPACK_POSTGRES_CA_PEM_FILE: /run/secrets/postgres_ca
      PETPACK_POSTGRES_APPLICATION_NAME: petpack-production-studio-api
      PETPACK_POSTGRES_POOL_MAX: "12"
      PETPACK_POSTGRES_CONNECTION_TIMEOUT_MS: "5000"
      PETPACK_POSTGRES_IDLE_TIMEOUT_MS: "10000"
      PETPACK_POSTGRES_STATEMENT_TIMEOUT_MS: "30000"
      PETPACK_SESSION_SIGNING_KEY_FILE: /run/secrets/session_signing_key
      PETPACK_STUDIO_INTERNAL_TOKEN_FILE: /run/secrets/studio_internal_token
      PETPACK_PAYMENT_NOTIFICATION_ENCRYPTION_KEY_FILE: /run/secrets/payment_notification_encryption_key
      PETPACK_SESSION_TTL_SECONDS: "2592000"
      PETPACK_SESSION_COOKIE_SECURE: "true"
      PETPACK_STUDIO_SESSION_COOKIE_NAME: petpack_session
      PETPACK_AUTH_POLICY_VERSION: cloudbase-phone-v1
      PETPACK_PHONE_AUTH_ENABLED: ${PETPACK_PHONE_AUTH_ENABLED:?Set PETPACK_PHONE_AUTH_ENABLED=true for production}
      PETPACK_GENERATION_SALES_ENABLED: ${PETPACK_GENERATION_SALES_ENABLED:-false}
      CLOUDBASE_ENV_ID: petpack-staging-d3ffsbun2dc89fae
      CLOUDBASE_REGION: ap-shanghai
      CLOUDBASE_AUTH_TIMEOUT_MS: "8000"
      PETPACK_OBJECT_STORE_ENDPOINT: ${PETPACK_OBJECT_STORE_ENDPOINT:?Set the production COS HTTPS endpoint}
      PETPACK_OBJECT_STORE_BUCKET: ${PETPACK_OBJECT_STORE_BUCKET:?Set the production COS bucket}
      PETPACK_OBJECT_STORE_REGION: ${PETPACK_OBJECT_STORE_REGION:?Set the production COS region}
      PETPACK_OBJECT_STORE_ACCESS_KEY_ID_FILE: /run/secrets/cos_access_key_id
      PETPACK_OBJECT_STORE_SECRET_ACCESS_KEY_FILE: /run/secrets/cos_secret_access_key
      MODEL_REGISTRY_VERSION: ${MODEL_REGISTRY_VERSION:?Set the frozen model registry version}
      MODELARK_BASE_URL: ${MODELARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      MODELARK_REGION: ${MODELARK_REGION:?Set the ModelArk region}
      MODELARK_API_KEY_FILE: /run/secrets/modelark_api_key
      MODELARK_SEEDREAM_ENDPOINT_ID: ${MODELARK_SEEDREAM_ENDPOINT_ID:?Set the Seedream endpoint ID}
      MODELARK_SEEDANCE_ENDPOINT_ID: ${MODELARK_SEEDANCE_ENDPOINT_ID:?Set the Seedance endpoint ID}
      MODELARK_SEEDREAM_OUTPUT_SIZE: ${MODELARK_SEEDREAM_OUTPUT_SIZE:-1536x864}
      MODELARK_VIDEO_RESOLUTION: "480p"
      KAIPAY_CREDENTIALS_JSON_FILE: /run/secrets/kaipay_credentials_json
      KAIPAY_API_BASE_URL: https://api.kaipay.cn
      KAIPAY_NOTIFY_BASE_URL: https://api.heyirmy.com/api/payments/kaipay/notify
      KAIPAY_RETURN_BASE_URL: https://heyirmy.com/projects/payment-return
      KAIPAY_ADAPTER_VERSION: kaipay-pay-api-v3-hmac-sha256/1
      KAIPAY_DEFAULT_CHANNEL: ALIPAY
      KAIPAY_ALIPAY_PROVIDER: fuyou
      KAIPAY_ALIPAY_PAY_METHOD: alipay
      KAIPAY_ALIPAY_SCENE: native
      KAIPAY_WECHAT_PROVIDER: fuyou
      KAIPAY_WECHAT_PAY_METHOD: wechat
      KAIPAY_WECHAT_SCENE: native
      KAIPAY_SELECTED_MERCHANT_CODE: ${KAIPAY_SELECTED_MERCHANT_CODE:-}
      KAIPAY_REQUEST_TIMEOUT_MS: "15000"
      KAIPAY_ALLOW_SIMULATED_PAYMENTS: "false"
    secrets:
      - postgres_url
      - postgres_ca
      - session_signing_key
      - studio_internal_token
      - payment_notification_encryption_key
      - cos_access_key_id
      - cos_secret_access_key
      - modelark_api_key
      - kaipay_credentials_json
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 192
    mem_limit: 1g
    cpus: "1.00"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)throw new Error('not-ready')})"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - petpack-edge
      - petpack-data
      - petpack-egress

  outbox-dispatcher:
    profiles: ["studio-production"]
    image: ${PETPACK_RUNTIME_IMAGE:?Set PETPACK_RUNTIME_IMAGE to an immutable image digest}
    container_name: petpack-outbox-dispatcher
    command: ["src/runtime/start-outbox-dispatcher.js"]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PETPACK_PLATFORM_MODE: production
      PETPACK_POSTGRES_URL_FILE: /run/secrets/postgres_url
      PETPACK_POSTGRES_CA_PEM_FILE: /run/secrets/postgres_ca
      PETPACK_POSTGRES_APPLICATION_NAME: petpack-production-outbox
      PETPACK_POSTGRES_POOL_MAX: "4"
      PETPACK_POSTGRES_CONNECTION_TIMEOUT_MS: "5000"
      PETPACK_POSTGRES_IDLE_TIMEOUT_MS: "10000"
      PETPACK_POSTGRES_STATEMENT_TIMEOUT_MS: "15000"
      PETPACK_REDIS_URL_FILE: /run/secrets/redis_url
      PETPACK_REDIS_CA_PEM_FILE: /run/secrets/redis_ca
      PETPACK_QUEUE_NAME: ${PETPACK_QUEUE_NAME:-petpack-production}
      PETPACK_QUEUE_PREFIX: ${PETPACK_QUEUE_PREFIX:-petpack}
      PETPACK_OUTBOX_POLL_INTERVAL_MS: "1000"
      PETPACK_OUTBOX_BUSY_INTERVAL_MS: "25"
      PETPACK_OUTBOX_MAX_ERROR_BACKOFF_MS: "30000"
      PETPACK_OUTBOX_BATCH_LIMIT: "25"
      PETPACK_OUTBOX_LEASE_SECONDS: "60"
      PETPACK_RUNTIME_ROLE: outbox-dispatcher
      PETPACK_RUNTIME_HEARTBEAT_FILE: /run/petpack/outbox-heartbeat.json
      PETPACK_RUNTIME_HEARTBEAT_INTERVAL_MS: "10000"
      PETPACK_RUNTIME_HEARTBEAT_MAX_AGE_MS: "45000"
    secrets:
      - postgres_url
      - postgres_ca
      - redis_url
      - redis_ca
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
      - /run/petpack:size=2m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.50"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "src/runtime/check-runtime-heartbeat.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - petpack-data

  studio-worker:
    profiles: ["studio-production"]
    image: ${PETPACK_WORKER_IMAGE:?Set PETPACK_WORKER_IMAGE to an immutable image digest}
    container_name: petpack-studio-worker
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PETPACK_PLATFORM_MODE: production
      PETPACK_POSTGRES_URL_FILE: /run/secrets/postgres_url
      PETPACK_POSTGRES_CA_PEM_FILE: /run/secrets/postgres_ca
      PETPACK_POSTGRES_APPLICATION_NAME: petpack-production-worker
      PETPACK_POSTGRES_POOL_MAX: "8"
      PETPACK_POSTGRES_CONNECTION_TIMEOUT_MS: "5000"
      PETPACK_POSTGRES_IDLE_TIMEOUT_MS: "10000"
      PETPACK_POSTGRES_STATEMENT_TIMEOUT_MS: "30000"
      PETPACK_REDIS_URL_FILE: /run/secrets/redis_url
      PETPACK_REDIS_CA_PEM_FILE: /run/secrets/redis_ca
      PETPACK_QUEUE_NAME: ${PETPACK_QUEUE_NAME:-petpack-production}
      PETPACK_QUEUE_PREFIX: ${PETPACK_QUEUE_PREFIX:-petpack}
      PETPACK_QUEUE_WORKER_CONCURRENCY: "7"
      PETPACK_WORKER_COMPONENTS_MODULE: /app/platform/src/runtime/production-worker-components.js
      PETPACK_WORKER_COMPONENTS_MANIFEST_SHA256: ${PETPACK_WORKER_COMPONENTS_MANIFEST_SHA256:-}
      PETPACK_WORKER_TEMP_ROOT: /work
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      PETPACK_MASTER_JOB_LEASE_SECONDS: "900"
      PETPACK_VIDEO_JOB_LEASE_SECONDS: "120"
      PETPACK_VIDEO_PROCESSING_LEASE_SECONDS: "900"
      PETPACK_PETPACK_JOB_LEASE_SECONDS: "180"
      PETPACK_PROVIDER_POLL_DELAY_SECONDS: "15"
      PETPACK_PROVIDER_POLL_QUERY_ATTEMPTS: "3"
      PETPACK_MAX_PROVIDER_POLLS: "120"
      PETPACK_HEAVY_JOB_CONCURRENCY: "1"
      PETPACK_DELIVERY_RETENTION_DAYS: ${PETPACK_DELIVERY_RETENTION_DAYS:-30}
      PETPACK_OBJECT_STORE_ENDPOINT: ${PETPACK_OBJECT_STORE_ENDPOINT:?Set the production COS HTTPS endpoint}
      PETPACK_OBJECT_STORE_BUCKET: ${PETPACK_OBJECT_STORE_BUCKET:?Set the production COS bucket}
      PETPACK_OBJECT_STORE_REGION: ${PETPACK_OBJECT_STORE_REGION:?Set the production COS region}
      PETPACK_OBJECT_STORE_ACCESS_KEY_ID_FILE: /run/secrets/cos_access_key_id
      PETPACK_OBJECT_STORE_SECRET_ACCESS_KEY_FILE: /run/secrets/cos_secret_access_key
      PETPACK_COS_MAX_VERIFIED_OBJECT_BYTES: "134217728"
      PETPACK_COS_MAX_ARCHIVE_OBJECT_BYTES: "134217728"
      MODEL_REGISTRY_VERSION: ${MODEL_REGISTRY_VERSION:?Set the frozen model registry version}
      MODELARK_BASE_URL: ${MODELARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      MODELARK_REGION: ${MODELARK_REGION:?Set the ModelArk region}
      MODELARK_API_KEY_FILE: /run/secrets/modelark_api_key
      MODELARK_SEEDREAM_ENDPOINT_ID: ${MODELARK_SEEDREAM_ENDPOINT_ID:?Set the Seedream endpoint ID}
      MODELARK_SEEDANCE_ENDPOINT_ID: ${MODELARK_SEEDANCE_ENDPOINT_ID:?Set the Seedance endpoint ID}
      MODELARK_SEEDREAM_OUTPUT_SIZE: ${MODELARK_SEEDREAM_OUTPUT_SIZE:-1536x864}
      MODELARK_VIDEO_RESOLUTION: "480p"
      MODELARK_IMAGE_MAX_CONCURRENT: "1"
      MODELARK_VIDEO_MAX_CONCURRENT: "7"
      MODELARK_IMAGE_MAX_RETRIES: "2"
      MODELARK_VIDEO_MAX_RETRIES: "2"
      PETPACK_RUNTIME_ROLE: studio-worker
      PETPACK_RUNTIME_HEARTBEAT_FILE: /run/petpack/worker-heartbeat.json
      PETPACK_RUNTIME_HEARTBEAT_INTERVAL_MS: "10000"
      PETPACK_RUNTIME_HEARTBEAT_MAX_AGE_MS: "45000"
    secrets:
      - postgres_url
      - postgres_ca
      - redis_url
      - redis_ca
      - cos_access_key_id
      - cos_secret_access_key
      - modelark_api_key
    read_only: true
    volumes:
      - petpack-worker-work:/work
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
      - /run/petpack:size=2m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: "3.00"
    # Chromium inside the pinned Electron delivery-validation runner maps
    # renderer shared memory under /dev/shm; the Docker default 64m is too
    # small for the interaction verification windows.
    shm_size: "256m"
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "node", "src/runtime/check-runtime-heartbeat.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - petpack-data
      - petpack-egress

networks:
  petpack-edge:
    external: true
    name: petpack-edge
  petpack-data:
    external: true
    name: petpack-data
  petpack-egress:
    external: true
    name: petpack-egress

volumes:
  petpack-worker-work:
    name: petpack-worker-work

secrets:
  postgres_url:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/postgres_url
  postgres_ca:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/postgres_ca.pem
  redis_url:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/redis_url
  redis_ca:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/redis_ca.pem
  cos_access_key_id:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/cos_access_key_id
  cos_secret_access_key:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/cos_secret_access_key
  modelark_api_key:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/modelark_api_key
  session_signing_key:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/session_signing_key
  studio_internal_token:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/studio_internal_token
  payment_notification_encryption_key:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/payment_notification_encryption_key
  kaipay_credentials_json:
    file: ${PETPACK_CONFIG_ROOT:?Set PETPACK_CONFIG_ROOT}/kaipay_credentials_json
