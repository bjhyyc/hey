name: petpack-data

services:
  postgres:
    image: ${PETPACK_POSTGRES_IMAGE:?Set PETPACK_POSTGRES_IMAGE to repository@sha256 digest}
    container_name: petpack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petpack_studio
      POSTGRES_USER: petpack_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/run/tls/postgres.crt
      - -c
      - ssl_key_file=/run/tls/postgres.key
      - -c
      - ssl_ca_file=/run/tls/ca.crt
      - -c
      - hba_file=/etc/postgresql/petpack-pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/petpack-pg_hba.conf:ro
      - ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/runtime-tls/postgres/ca.crt:/run/tls/ca.crt:ro
      - ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/runtime-tls/postgres/postgres.crt:/run/tls/postgres.crt:ro
      - ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/runtime-tls/postgres/postgres.key:/run/tls/postgres.key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$(cat /run/secrets/postgres_admin_password)"
          PGSSLMODE=verify-full
          PGSSLROOTCERT=/run/tls/ca.crt
          psql --host=postgres --username=petpack_admin --dbname=petpack_studio
          --tuples-only --no-align --command='SELECT 1' | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - petpack-data

  redis:
    image: ${PETPACK_REDIS_IMAGE:?Set PETPACK_REDIS_IMAGE to repository@sha256 digest}
    container_name: petpack-redis
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/start-petpack-redis.sh"]
    environment:
      PETPACK_REDIS_KEY_PREFIX: ${PETPACK_REDIS_KEY_PREFIX:-petpack}
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/start-petpack-redis.sh:/usr/local/bin/start-petpack-redis.sh:ro
      - ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/runtime-tls/redis/ca.crt:/run/tls/ca.crt:ro
      - ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/runtime-tls/redis/redis.crt:/run/tls/redis.crt:ro
      - ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/runtime-tls/redis/redis.key:/run/tls/redis.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /run/petpack-redis:size=2m,mode=0700,nosuid,nodev
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --tls --cacert /run/tls/ca.crt --user petpack -h redis ping |
          grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - petpack-data

networks:
  petpack-data:
    name: petpack-data
    internal: true

volumes:
  postgres_data:
    name: petpack-postgres-data
  redis_data:
    name: petpack-redis-data

secrets:
  postgres_admin_password:
    file: ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/secrets/postgres_admin_password
  postgres_app_password:
    file: ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/secrets/postgres_app_password
  redis_password:
    file: ${PETPACK_DATA_CONFIG_ROOT:?Set absolute PETPACK_DATA_CONFIG_ROOT}/secrets/redis_password
