services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: petpack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petpack_studio
      POSTGRES_USER: petpack_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/tls/postgres.crt
      - -c
      - ssl_key_file=/run/tls/postgres.key
      - -c
      - ssl_ca_file=/run/tls/ca.crt
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./tls:/run/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=petpack_admin --dbname=petpack_studio"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - petpack-data

  redis:
    image: redis:8.2.7-bookworm
    container_name: petpack-redis
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/start-petpack-redis.sh"]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/start-petpack-redis.sh:/usr/local/bin/start-petpack-redis.sh:ro
      - ./tls:/run/tls:ro
    tmpfs:
      - /run/petpack-redis:mode=0700
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --tls --cacert /run/tls/ca.crt --user petpack ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - petpack-data

networks:
  petpack-data:
    name: petpack-data
    internal: true

volumes:
  postgres_data:
    name: petpack-postgres-data
  redis_data:
    name: petpack-redis-data

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  redis_password:
    file: ./secrets/redis_password
