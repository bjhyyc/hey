port 0
tls-port 6379
tls-cert-file /run/tls/redis.crt
tls-key-file /run/tls/redis.key
tls-ca-cert-file /run/tls/ca.crt
tls-auth-clients no

bind 0.0.0.0 ::0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

dir /data
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

maxmemory 768mb
maxmemory-policy noeviction
save 900 1
save 300 10
save 60 10000

loglevel notice
databases 16
