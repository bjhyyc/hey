# Local initialization, backup and maintenance stay on the Unix socket.
local   all             all                                     trust

# Network clients must use TLS. Reject plaintext before any password check.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::0/0                    reject
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::0/0                    scram-sha-256
