extends: null
appId: com.heyirmy.hey
productName: Hey
directories:
  output: release-mac
files:
  - dist/renderer/**/*
  - src/**/*
  - package.json
  - '!node_modules/ffmpeg-static/**/*'
mac:
  target:
    - dmg
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
